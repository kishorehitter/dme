<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Download DME – Chat App</title>
    <meta name="description" content="Download DME, a fast and private chat app for Android.">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0d0d0f;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Animated gradient background blobs */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.25;
            pointer-events: none;
            animation: drift 8s ease-in-out infinite alternate;
        }
        body::before {
            width: 400px; height: 400px;
            background: radial-gradient(circle, #6c63ff, transparent);
            top: -100px; left: -100px;
        }
        body::after {
            width: 350px; height: 350px;
            background: radial-gradient(circle, #ff6584, transparent);
            bottom: -80px; right: -80px;
            animation-delay: 2s;
        }
        @keyframes drift {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(30px, 30px) scale(1.1); }
        }

        .card {
            position: relative;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 48px 36px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 32px 80px rgba(0,0,0,0.6);
        }

        .app-icon {
            width: 96px; height: 96px;
            border-radius: 22px;
            margin: 0 auto 24px;
            display: block;
            background: linear-gradient(135deg, #6c63ff, #a78bfa);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 46px;
            box-shadow: 0 8px 24px rgba(108,99,255,0.4);
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            color: #9ca3af;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 36px;
        }

        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #6c63ff, #a78bfa);
            color: #fff;
            text-decoration: none;
            padding: 16px 28px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.2px;
            transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
            box-shadow: 0 8px 24px rgba(108,99,255,0.4);
            cursor: pointer;
            border: none;
            width: 100%;
        }
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(108,99,255,0.55);
        }
        .download-btn:active { transform: scale(0.97); }
        .download-btn svg { width: 20px; height: 20px; flex-shrink: 0; }
        .download-btn.loading { opacity: 0.7; pointer-events: none; }

        .version-tag {
            display: inline-block;
            margin-top: 16px;
            color: #6b7280;
            font-size: 12px;
        }

        .divider {
            height: 1px;
            background: rgba(255,255,255,0.08);
            margin: 28px 0;
        }

        .features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            text-align: left;
        }
        .feature {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            color: #9ca3af;
            font-size: 13px;
            line-height: 1.4;
        }
        .feature-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(16,185,129,0.15);
            border: 1px solid rgba(16,185,129,0.3);
            color: #10b981;
            border-radius: 100px;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .status-badge::before {
            content: '';
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>

        <h1>DME Chat</h1>
        <p class="tagline">A fast, private messaging app. Stay connected with the people who matter most.</p>

        <!-- Download button — JS resolves the real APK URL from GitHub API -->
        <a id="downloadBtn" class="download-btn" href="{{ github_latest_url }}" target="_blank">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />

        </a>

        <div class="divider"></div>

        <div class="features">
            <div class="feature"><span class="feature-icon">🔒</span> End-to-end messaging</div>
            <div class="feature"><span class="feature-icon">📞</span> Voice & video calls</div>
            <div class="feature"><span class="feature-icon">🖼️</span> Share photos & files</div>
            <div class="feature"><span class="feature-icon">🎵</span> Voice messages</div>
        </div>
    </div>

    <script>
        // Fetch the latest release from GitHub API and wire up the direct APK download URL.
        // This matches exactly what the in-app updateChecker.ts does.
        const GITHUB_OWNER = 'kishorehitter';
        const GITHUB_REPO  = 'DME-releases';

        const btn     = document.getElementById('downloadBtn');
        const btnText = document.getElementById('btnText');
        const verTag  = document.getElementById('versionTag');

        btn.classList.add('loading');

        fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/releases/latest`)
            .then(res => res.ok ? res.json() : Promise.reject())
            .then(release => {
                const apkAsset = release.assets?.find(a => a.name.endsWith('.apk'));
                const url = apkAsset?.browser_download_url ?? release.html_url;
                const tag = release.tag_name ?? '';

                btn.href = url;
                btn.removeAttribute('target');  // direct download, not new tab
                btnText.textContent = 'Download APK';
                verTag.textContent  = tag ? `Latest: ${tag}` : '';
                btn.classList.remove('loading');
            })
            .catch(() => {
                // Fallback to GitHub releases page if API fails
                btn.href = `https://github.com/${GITHUB_OWNER}/${GITHUB_REPO}/releases/latest`;
                btn.setAttribute('target', '_blank');
                btnText.textContent = 'Download APK';
                verTag.textContent  = '';
                btn.classList.remove('loading');
            });
    </script>
